<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN" "http://www.w3.org/TR/html4/loose.dtd">
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  <title>Set Password - Online Booking System</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style type="text/css">
    body {
      margin: 0;
      font-family: 'Inter', sans-serif;
      background: url([[@{/images/xjtlu.png}]]) no-repeat center center fixed;
      -webkit-background-size: cover;
      -moz-background-size: cover;
      -o-background-size: cover;
      background-size: cover;
      color: #333;
    }

    .header {
      background-color: #1e3a8a;
      padding: 20px 40px;
      position: fixed;
      width: 100%;
      top: 0;
      left: 0;
      z-index: 1000;
    }

    .logo {
      width: 50px;
      height: 50px;
      background-color: white;
      border-radius: 15px;
      color: #1e3a8a;
      font-weight: bold;
      font-size: 24px;
      text-align: center;
      line-height: 50px;
    }

    .system-name {
      font-size: 28px;
      font-weight: 600;
      color: white;
      padding-left: 20px;
    }

    .auth-container {
      position: absolute;
      top: 50%;
      left: 70%;
      transform: translate(-50%, -50%);
      background: rgba(255, 255, 255, 0.95);
      padding: 40px;
      width: 360px;
      border-radius: 20px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
    }

    .auth-title {
      color: #1e3a8a;
      font-size: 24px;
      font-weight: 600;
      margin: 0 0 30px 0;
      text-align: center;
    }

    .input-group {
      margin-bottom: 20px;
    }

    .input-group label {
      display: block;
      margin-bottom: 8px;
      color: #4b5563;
      font-weight: 500;
    }

    .input-field {
      width: 93%;
      padding: 12px;
      border: 2px solid #e6f0ff;
      border-radius: 8px;
      font-size: 16px;
      margin: 8px 0;
      transition: all 0.3s ease;
    }

    .input-field:focus {
      border-color: #1e3a8a;
      outline: none;
      box-shadow: 0 0 0 3px rgba(30, 58, 138, 0.1);
    }

    .auth-button {
      width: 100%;
      padding: 12px;
      background-color: #1e3a8a;
      color: white;
      border: none;
      font-size: 16px;
      font-weight: 500;
      cursor: pointer;
      border-radius: 8px;
      transition: all 0.3s ease;
      margin-top: 10px;
    }

    .auth-button:hover {
      background-color: #1e40af;
      transform: translateY(-2px);
    }

    .auth-button:disabled {
      background-color: #9ca3af;
      cursor: not-allowed;
      transform: none;
    }

    .error-message {
      color: #dc2626;
      margin: 10px 0;
      font-size: 14px;
      text-align: center;
    }

    .success-message {
      color: #059669;
      margin: 10px 0;
      font-size: 14px;
      text-align: center;
    }

    .password-requirements {
      margin: 15px 0;
      padding: 15px;
      background-color: #f8fafc;
      border-radius: 8px;
      border: 1px solid #e6f0ff;
    }

    .requirement-title {
      color: #4b5563;
      font-size: 14px;
      font-weight: 500;
      margin-bottom: 10px;
    }

    .requirement-item {
      color: #6b7280;
      font-size: 13px;
      margin: 5px 0;
      display: flex;
      align-items: center;
    }

    .requirement-item:before {
      content: "•";
      color: #9ca3af;
      margin-right: 8px;
    }

    .requirement-item.valid {
      color: #059669;
    }

    .requirement-item.valid:before {
      content: "✓";
      color: #059669;
    }

    .password-strength {
      height: 4px;
      background: #e6f0ff;
      margin-top: 8px;
      border-radius: 2px;
      overflow: hidden;
    }

    .strength-meter {
      height: 100%;
      width: 0;
      background: #1e3a8a;
      transition: all 0.3s ease;
    }

    .lang-switch {
      color: white;
      font-size: 14px;
    }

    .lang-switch a {
      color: white;
      text-decoration: none;
      margin: 0 5px;
      transition: all 0.3s ease;
    }

    .lang-switch a:hover {
      color: #e6f0ff;
    }

    .back-button {
      color: #1e3a8a;
      text-decoration: none;
      font-size: 14px;
      display: block;
      text-align: center;
      margin-top: 15px;
    }

    .back-button:hover {
      color: #1e40af;
      text-decoration: underline;
    }
  </style>
</head>
<body>
<table width="100%" border="0" cellspacing="0" cellpadding="0" class="header">
  <tr>
    <td>
      <table border="0" cellspacing="0" cellpadding="0" width="100%">
        <tr>
          <td>
            <table border="0" cellspacing="0" cellpadding="0">
              <tr>
                <td class="logo">XJTLU</td>
                <td class="system-name">Online Booking System</td>
              </tr>
            </table>
          </td>
          <!--<td align="right" class="lang-switch">
            <a href="#">English</a> | <a href="#">中文</a>
          </td>-->
        </tr>
      </table>
    </td>
  </tr>
</table>

<table class="auth-container" border="0" cellspacing="0" cellpadding="0">
  <tr>
    <td>
      <h2 class="auth-title">Set Your Password</h2>
      <form th:action="${isReset != null && isReset ? '/SetNewPassword' : '/setPasswordPage'}" method="post">
        <input type="hidden" name="id" th:value="${id}">
        <input type="hidden" name="email" th:value="${email}">
        <input type="hidden" name="type" th:value="${param.type}">
        <table width="100%" border="0" cellspacing="0" cellpadding="0">
          <tr>
            <td class="input-group">
              <label for="password1">New Password</label>
              <input class="input-field" type="password" id="password1" name="password1"
                     placeholder="Enter new password" required>
              <div class="password-strength">
                <div class="strength-meter"></div>
              </div>
            </td>
          </tr>
          <tr>
            <td class="input-group">
              <label for="password2">Confirm Password</label>
              <input class="input-field" type="password" id="password2" name="password2"
                     placeholder="Confirm new password" required>
            </td>
          </tr>
          <tr>
            <td>
              <div class="password-requirements">
                <div class="requirement-title">Password Requirements:</div>
                <div class="requirement-item" id="length">At least 8 characters long</div>
                <div class="requirement-item" id="alphanumeric">Include both letters and numbers</div>
                <div class="requirement-item" id="special">Include at least one special character</div>
                <div class="requirement-item" id="match">Passwords match</div>
              </div>
            </td>
          </tr>
          <tr th:if="${error}">
            <td>
              <p class="error-message" th:text="${error}"></p>
            </td>
          </tr>
          <tr th:if="${success}">
            <td>
              <p class="success-message" th:text="${success}"></p>
            </td>
          </tr>
          <tr>
            <td>
              <input type="submit" class="auth-button" value="Set Password" id="submitBtn">
            </td>
          </tr>
          <tr>
            <td>
              <a href="/login" class="back-button">Back to Login</a>
            </td>
          </tr>
        </table>
      </form>
    </td>
  </tr>
</table>

<script type="text/javascript">
  const password1Input = document.getElementById('password1');
  const password2Input = document.getElementById('password2');
  const submitBtn = document.getElementById('submitBtn');
  const requirements = {
    length: document.getElementById('length'),
    alphanumeric: document.getElementById('alphanumeric'),
    special: document.getElementById('special'),
    match: document.getElementById('match')
  };

  function updateRequirements() {
    const password1 = password1Input.value;
    const password2 = password2Input.value;

    // 检查长度
    if(password1.length >= 8) {
      requirements.length.classList.add('valid');
    } else {
      requirements.length.classList.remove('valid');
    }

    // 检查字母和数字
    if(/[a-zA-Z]/.test(password1) && /[0-9]/.test(password1)) {
      requirements.alphanumeric.classList.add('valid');
    } else {
      requirements.alphanumeric.classList.remove('valid');
    }

    // 检查特殊字符
    if(/[^A-Za-z0-9]/.test(password1)) {
      requirements.special.classList.add('valid');
    } else {
      requirements.special.classList.remove('valid');
    }

    // 检查密码匹配
    if(password1 && password2 && password1 === password2) {
      requirements.match.classList.add('valid');
    } else {
      requirements.match.classList.remove('valid');
    }

    // 更新提交按钮状态
    submitBtn.disabled = !Array.from(document.querySelectorAll('.requirement-item'))
            .every(item => item.classList.contains('valid'));

    // 更新强度指示器
    let strength = 0;
    if(password1.length >= 8) strength += 25;
    if(/[a-zA-Z]/.test(password1) && /[0-9]/.test(password1)) strength += 25;
    if(/[^A-Za-z0-9]/.test(password1)) strength += 25;
    if(/[A-Z]/.test(password1) && /[a-z]/.test(password1)) strength += 25;

    const strengthMeter = document.querySelector('.strength-meter');
    strengthMeter.style.width = strength + '%';

    if(strength <= 25) {
      strengthMeter.style.backgroundColor = '#dc2626';
    } else if(strength <= 50) {
      strengthMeter.style.backgroundColor = '#f59e0b';
    } else if(strength <= 75) {
      strengthMeter.style.backgroundColor = '#10b981';
    } else {
      strengthMeter.style.backgroundColor = '#059669';
    }
  }

  password1Input.addEventListener('input', updateRequirements);
  password2Input.addEventListener('input', updateRequirements);

  document.querySelector('form').addEventListener('submit', function(e) {
    if(!submitBtn.disabled) {
      return true;
    }
    e.preventDefault();
    return false;
  });
</script>
</body>
</html>
