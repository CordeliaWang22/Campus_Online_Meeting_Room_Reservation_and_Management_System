<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN">
<html>
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  <title>Activate Success</title>
  <style type="text/css">
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: url('../static/images/xjtlu.png') no-repeat center center fixed;
      background-size: cover;
    }

    #header {
      background-color: #4E84F0;
      height: 100px;
      width: 100%;
    }

    #title {
      font-size: 24px;
      font-weight: bold;
      color: #000000;
      line-height: 100px;
      padding-left: 30px;
      float: left;
    }

    #lang {
      float: right;
      margin-top: 40px;
      margin-right: 20px;
      font-size: 14px;
    }

    #popup-box {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 400px;
      padding: 30px;
      background-color: white;
      transform: translate(-50%, -50%);
      border: 2px solid black;
      box-shadow: 0 0 10px #00000088;
      text-align: center;
    }

    .close-btn {
      position: absolute;
      top: 10px;
      right: 15px;
      color: red;
      font-weight: bold;
      font-size: 18px;
      cursor: pointer;
    }

    .continue-button {
      width: 200px;
      height: 35px;
      background-color: rgba(78, 132, 240, 0.8);
      border: none;
      font-size: 14px;
      font-weight: bold;
      color: white;
      cursor: pointer;
      margin-top: 15px;
    }

    .note {
      font-size: 12px;
      color: #555;
      margin-top: 10px;
    }
  </style>

  <script type="text/javascript">
    function redirectToPassword() {
      window.location.href = "Login.html"; // ✅ 设置跳转地址
    }

    window.onload = function () {
      setTimeout(redirectToPassword, 5000); // ⏳ 5秒后自动跳转
    }
  </script>
</head>

<body>
<div id="header">
  <div id="title">Online Booking System</div>
  <div id="lang">
    <a href="#">中文</a> | <a href="#">English</a>
  </div>
</div>

<div id="popup-box">
  <div class="close-btn" onclick="redirectToPassword()">×</div>
  <h2>Activate successfully!</h2>
  <p class="note">Automatic redirect to Password setting...</p>
  <input type="button" class="continue-button" value="Continue" onclick="redirectToPassword()">
</div>
</body>
</html>
