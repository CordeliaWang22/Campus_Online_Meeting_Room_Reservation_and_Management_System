
<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN" "http://www.w3.org/TR/html4/loose.dtd">
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <title>Verify Email - Online Booking System</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style type="text/css">
        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            background: url([[@{/images/xjtlu.png}]]) no-repeat center center fixed;
            -webkit-background-size: cover;
            -moz-background-size: cover;
            -o-background-size: cover;
            background-size: cover;
            color: #333;
        }

        .header {
            background-color: #1e3a8a;
            padding: 20px 40px;
            position: fixed;
            width: 100%;
            top: 0;
            left: 0;
            z-index: 1000;
        }

        .logo {
            width: 50px;
            height: 50px;
            background-color: white;
            border-radius: 15px;
            color: #1e3a8a;
            font-weight: bold;
            font-size: 24px;
            text-align: center;
            line-height: 50px;
        }

        .system-name {
            font-size: 28px;
            font-weight: 600;
            color: white;
            padding-left: 20px;
        }

        .auth-container {
            position: absolute;
            top: 50%;
            left: 70%;
            transform: translate(-50%, -50%);
            background: rgba(255, 255, 255, 0.95);
            padding: 40px;
            width: 360px;
            border-radius: 20px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        }

        .auth-title {
            color: #1e3a8a;
            font-size: 24px;
            font-weight: 600;
            margin: 0 0 30px 0;
            text-align: center;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            color: #4b5563;
            font-weight: 500;
        }

        .input-field {
            width: 93%;
            padding: 12px;
            border: 2px solid #e6f0ff;
            border-radius: 8px;
            font-size: 16px;
            margin: 8px 0;
            transition: all 0.3s ease;
        }

        .input-field:focus {
            border-color: #1e3a8a;
            outline: none;
            box-shadow: 0 0 0 3px rgba(30, 58, 138, 0.1);
        }

        .auth-button {
            width: 100%;
            padding: 12px;
            background-color: #1e3a8a;
            color: white;
            border: none;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        .auth-button:hover {
            background-color: #1e40af;
            transform: translateY(-2px);
        }

        .send-code-button {
            width: 100%;
            padding: 12px;
            background-color: #4f46e5;
            color: white;
            border: none;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        .send-code-button:hover {
            background-color: #4338ca;
            transform: translateY(-2px);
        }

        .send-code-button:disabled {
            background-color: #9ca3af;
            cursor: not-allowed;
            transform: none;
        }

        .error-message {
            color: #dc2626;
            margin: 10px 0;
            font-size: 14px;
            text-align: center;
        }

        .success-message {
            color: #059669;
            margin: 10px 0;
            font-size: 14px;
            text-align: center;
        }

        .lang-switch {
            color: white;
            font-size: 14px;
        }

        .lang-switch a {
            color: white;
            text-decoration: none;
            margin: 0 5px;
            transition: all 0.3s ease;
        }

        .lang-switch a:hover {
            color: #e6f0ff;
        }

        .back-button {
            color: #1e3a8a;
            text-decoration: none;
            font-size: 14px;
            display: block;
            text-align: center;
            margin-top: 15px;
        }

        .back-button:hover {
            color: #1e40af;
            text-decoration: underline;
        }
    </style>
</head>
<body>
<table width="100%" border="0" cellspacing="0" cellpadding="0" class="header">
    <tr>
        <td>
            <table border="0" cellspacing="0" cellpadding="0" width="100%">
                <tr>
                    <td>
                        <table border="0" cellspacing="0" cellpadding="0">
                            <tr>
                                <td class="logo">XJTLU</td>
                                <td class="system-name">Online Booking System</td>
                            </tr>
                        </table>
                    </td>
                    <!--<td align="right" class="lang-switch">
                        <a href="#">English</a> | <a href="#">中文</a>
                    </td>-->
                </tr>
            </table>
        </td>
    </tr>
</table>

<table class="auth-container" border="0" cellspacing="0" cellpadding="0">
    <tr>
        <td>
            <h2 class="auth-title">Email Verification</h2>

            <form th:action="${type == 'register' ? '/sendCode' : '/forgotPassword/sendCode'}" method="post" id="sendCodeForm">
                <table width="100%" border="0" cellspacing="0" cellpadding="0">
                    <tr>
                        <td class="input-group">
                            <label for="id">User ID</label>
                            <input class="input-field" type="text" id="id" name="id" th:value="${id}" required>
                        </td>
                    </tr>
                    <tr>
                        <td class="input-group">
                            <label for="email">Email</label>
                            <input class="input-field" type="email" id="email" name="email" th:value="${email}" readonly required>
                        </td>
                    </tr>
                    <tr>
                        <td>
                            <button type="submit" class="send-code-button" id="sendCodeBtn">Send Code</button>
                        </td>
                    </tr>
                </table>
            </form>

            <!-- 验证码验证表单 -->
            <form th:action="${type == 'register' ? '/VerifyPage' : '/forgotPassword/verify'}" method="post" id="verifyForm">
                <input type="hidden" name="id" th:value="${id}">
                <input type="hidden" name="email" th:value="${email}">
                <input type="hidden" name="type" th:value="${type}">
                <table width="100%" border="0" cellspacing="0" cellpadding="0">
                    <tr>
                        <td class="input-group">
                            <label for="code">Verification Code</label>
                            <input class="input-field" type="text" id="code" name="code" placeholder="Enter verification code" required>
                        </td>
                    </tr>
                    <tr th:if="${error}">
                        <td>
                            <p class="error-message" th:text="${error}"></p>
                        </td>
                    </tr>
                    <tr th:if="${info}">
                        <td>
                            <p class="success-message" th:text="${info}"></p>
                        </td>
                    </tr>
                    <tr th:if="${success}">
                        <td>
                            <p class="success-message" th:text="${success}"></p>
                        </td>
                    </tr>
                    <tr>
                        <td>
                            <input type="submit" class="auth-button" value="Verify">
                        </td>
                    </tr>
                </table>
            </form>
            <a href="/login" class="back-button">Back to Login</a>
        </td>
    </tr>
</table>

<script type="text/javascript">
    const sendCodeBtn = document.getElementById('sendCodeBtn');
    let countdown = 60;
    let timer = null;

    function startCountdown() {
        sendCodeBtn.disabled = true;
        timer = setInterval(() => {
            if (countdown > 0) {
                sendCodeBtn.textContent = `Resend Code (${countdown}s)`;
                countdown--;
            } else {
                clearInterval(timer);
                sendCodeBtn.disabled = false;
                sendCodeBtn.textContent = 'Send Code';
                countdown = 60;
            }
        }, 1000);
    }

    document.getElementById('sendCodeForm').addEventListener('submit', function(e) {
        if (!timer) {
            startCountdown();
        }
    });
</script>
</body>
</html>
